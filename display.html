<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안내 화면</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="display-page">
  <div id="wait" class="wait">
    <div>
      <div id="waitMsg" class="wait-msg">서버에 연결 중…</div>
      <div id="code" class="code">------</div>
      <div class="wait-sub">조작 화면의 “표시화면 연결”에서 위 코드를 입력하세요.<br>이 화면을 한 번 클릭하면 전체화면과 소리가 켜집니다.</div>
    </div>
  </div>
  <div id="screen" class="screen">
    <img class="screen-img" alt="" src="">
    <div class="screen-dest"></div>
  </div>
  <div id="soundHint" style="display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff;font-size:16px;pointer-events:none;">🔇 소리가 막혀 있습니다. 이 화면을 한 번 클릭하세요.</div>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script type="module" src="js/display.js"></script>
</body>
</html>
